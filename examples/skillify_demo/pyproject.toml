[project]
name = "ai-functions-skillify-demo-example"
version = "0.1.0"
description = "@skillify on ScienceWorld: an AI Function learns skills from its own calls, measured on held-out tasks"
requires-python = ">=3.12"
dependencies = [
    "strands-ai-functions",
    "rich>=13.7",
    # The environment. Ships a bundled scienceworld.jar, so a JVM must be on
    # the host -- see README.md. Tasks are generated by the package itself;
    # no benchmark corpus is vendored into this repository.
    "scienceworld>=1.2.3",
]

[tool.uv.sources]
strands-ai-functions = { workspace = true }
