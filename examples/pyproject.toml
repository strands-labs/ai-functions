[project]
name = "ai-functions-examples"
version = "0.1.0"
dependencies = [
    "strands-ai-functions[agentcore,claude-code,kiro,network]",
    "rich>=13.7",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "yfinance>=0.2.40",
    "plotly>=5.20",
    "sympy>=1.14.0",
    "networkx>=3.0",
    "strands-agents-tools>=0.8.2",
]

[tool.uv.sources]
strands-ai-functions = { workspace = true }

# The helpers in `example_helpers` are installed with the project, so every
# example, in any folder, can import them when run with `uv run`.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["example_helpers"]
